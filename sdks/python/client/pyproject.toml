[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-gass-api"
version = "14.50.150"
description = "Official Python SDK for the SPACE GASS API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Space Gass Pty Ltd" },
]
keywords = ["spacegass", "structural-analysis", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "microsoft-kiota-bundle>=1.9.8",
]

[project.urls]
Documentation = "https://api.spacegass.com/docs/"
Repository = "https://github.com/SpaceGass/space-gass-api"
Issues = "https://github.com/SpaceGass/space-gass-api/issues"

[tool.setuptools.packages.find]
include = ["space_gass_api*"]
namespaces = true

[tool.setuptools.package-data]
space_gass_api = ["py.typed", "*.pyi"]
