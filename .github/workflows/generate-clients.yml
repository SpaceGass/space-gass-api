name: Generate SDK Clients

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SPEC_PATH: descriptions/preview/openapi.json

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kiota
        run: dotnet tool install --global Microsoft.OpenApi.Kiota

      - name: Generate C# client
        run: |
          kiota generate \
            --openapi "$SPEC_PATH" \
            --language csharp \
            --output sdks/csharp/client/SpaceGassApi/Generated \
            --namespace-name SpaceGassApi \
            --class-name SpaceGassApiClient \
            --clean-output

      - name: Generate Python client
        run: |
          kiota generate \
            --openapi "$SPEC_PATH" \
            --language python \
            --output sdks/python/client/space_gass_api \
            --namespace-name space_gass_api \
            --class-name SpaceGassApiClient \
            --clean-output

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sdk/regenerate-clients
          title: "chore: regenerate SDK clients"
          body: |
            Auto-generated SDK client update from `${{ env.SPEC_PATH }}`.

            ## Changes
            - Regenerated C# client in `sdks/csharp/client/SpaceGassApi/Generated/`
            - Regenerated Python client in `sdks/python/client/space_gass_api/`

            Please review the generated code for any breaking changes before merging.
          commit-message: "chore: regenerate SDK clients"
          delete-branch: true
