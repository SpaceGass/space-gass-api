name: Generate SDK Clients

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SPEC_PATH: descriptions/preview/openapi.json

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch spec — make optional requestBody.required explicit
        run: |
          # Microsoft.OpenApi 1.6.x's serializer drops `required: false` because
          # false is the default. Kiota then treats the missing field as required
          # and generates a non-optional body parameter. The C# RequestBodyRequiredFilter
          # already emits `"required": true` for non-nullable bodies, so any requestBody
          # still missing `required` here is the optional case — make it explicit.
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const spec = JSON.parse(fs.readFileSync(p, "utf8"));
            let touched = 0;
            for (const path of Object.values(spec.paths || {})) {
              for (const op of Object.values(path)) {
                if (op && typeof op === "object" && op.requestBody && !("required" in op.requestBody)) {
                  op.requestBody.required = false;
                  touched++;
                }
              }
            }
            fs.writeFileSync(p, JSON.stringify(spec, null, 2));
            console.log("Made " + touched + " requestBody parameter(s) explicitly optional.");
          ' "$SPEC_PATH"

      - name: Install Kiota
        run: dotnet tool install --global Microsoft.OpenApi.Kiota

      - name: Generate C# client
        run: |
          kiota generate \
            --openapi "$SPEC_PATH" \
            --language csharp \
            --output sdks/csharp/client/SpaceGassApi/Generated \
            --namespace-name SpaceGassApi \
            --clean-output

      - name: Generate Python client
        run: |
          kiota generate \
            --openapi "$SPEC_PATH" \
            --language python \
            --output sdks/python/client/space_gass_api \
            --namespace-name space_gass_api \
            --clean-output

      - name: Regenerate Python __init__ aggregators
        run: |
          # Kiota emits a PEP 420 namespace package (no __init__.py files),
          # so `import space_gass_api.models as models` + `models.NodeCreate`
          # doesn't resolve. This script writes the aggregator __init__.py
          # files inside the generated tree, glued to the hand-maintained
          # `space_gass_api_extensions.py` at the client root.
          python3 tools/regen_python_inits.py

      - name: Sync SDK source versions to spec
        id: sync_version
        run: |
          VERSION=$(jq -r '.info["x-space-gass-build"]' "$SPEC_PATH")
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::info.x-space-gass-build is missing from $SPEC_PATH"
            exit 1
          fi
          sed -i "s/^version = .*/version = \"$VERSION\"/" sdks/python/client/pyproject.toml
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|" sdks/csharp/client/SpaceGassApi/SpaceGassApi.csproj
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Synced SDK source versions to $VERSION"

      - name: Push regenerated clients to branch
        env:
          VERSION: ${{ steps.sync_version.outputs.version }}
          BRANCH: sdk/regenerate-clients
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected — skipping push."
            echo "compare_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "$BRANCH"
          git commit -m "chore: regenerate SDK clients ($VERSION)"
          git push --force origin "$BRANCH"
          echo "Pushed branch $BRANCH. Open a PR at: https://github.com/${GITHUB_REPOSITORY}/compare/${BRANCH}?expand=1"
          {
            echo "## SDK clients regenerated"
            echo ""
            echo "Pushed to branch \`$BRANCH\` at version **$VERSION** (from \`info.x-space-gass-build\`)."
            echo ""
            echo "[Open a pull request](https://github.com/${GITHUB_REPOSITORY}/compare/${BRANCH}?expand=1)"
          } >> "$GITHUB_STEP_SUMMARY"
